packages:
  - apps/*
  - tests/e2e
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - argon2
  - "@nestjs/core"
  - unrs-resolver
# Next.js pulls in sharp (and its LGPL libvips binary) only for next/image optimisation, which this app does not use.
overrides:
  sharp: "-"
